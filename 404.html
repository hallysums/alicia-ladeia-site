<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Dra. Alicia Ladeia</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102B24">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23102B24%27/%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:#102B24;color:#F8F5EF;font-family:Georgia,serif;text-align:center;padding:24px}
    h1{font-weight:500;font-size:clamp(40px,8vw,72px);margin:0 0 12px;line-height:1.05}
    em{color:#CDB68B}
    p{font-family:system-ui,sans-serif;opacity:.78;margin:0 0 28px}
    a{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:#F8F5EF;color:#102B24;text-decoration:none;font-family:system-ui,sans-serif;font-weight:500}
  </style>
</head>
<body>
  <main>
    <h1>Página não <em>encontrada.</em></h1>
    <p>O endereço acessado não existe ou foi alterado.</p>
    <a href="./" id="home">Voltar ao início</a>
  </main>
  <script>/* funciona no GitHub Pages (subpasta) e em domínio próprio */
    var p=location.pathname.split('/')[1];document.getElementById('home').href=(location.hostname.endsWith('github.io')&&p)?'/'+p+'/':'/';</script>
</body>
</html>
